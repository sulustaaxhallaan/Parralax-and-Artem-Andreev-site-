# ==================================================================
#  Parallax Studio — статическая копия сайта на VPS.
#
#  ОБРАЗЕЦ. Сам на сервер не попадает: кладётся вручную, см. шаги ниже.
#
#  Только порт 80 и только адрес 5.129.210.143. Порт 443, VPN и Docker
#  этот файл не трогает. default_server не ставится намеренно: если на
#  80-м уже кто-то слушает, блок не перехватит чужие запросы, а ответит
#  только на обращения по этому IP.
#
#  Установка (на сервере, один раз):
#    1. Проверить, что 80-й свободен или занят самим Nginx:
#         sudo ss -tlnp | grep -E ':(80|443)\b'
#    2. Каталог сайта и пользователь для деплоя без sudo:
#         sudo adduser --disabled-password --gecos "" deploy
#         sudo mkdir -p /var/www/parallax/releases
#         sudo chown -R deploy:deploy /var/www/parallax
#    3. Подключить конфиг и проверить его ДО перезагрузки:
#         sudo cp parallax.conf /etc/nginx/sites-available/parallax.conf
#         sudo ln -s /etc/nginx/sites-available/parallax.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
#  Отдаёт /var/www/parallax/current — это ссылка на последний релиз.
#  Деплой кладёт новый релиз рядом и переставляет ссылку одной
#  операцией, поэтому посетитель никогда не видит полузалитый сайт.
# ==================================================================

server {
    listen 80;
    listen [::]:80;
    server_name 5.129.210.143;

    root /var/www/parallax/current;
    index index.html;

    # Сборка с trailingSlash: false: /design лежит как design.html,
    # а рядом папка design/ с вложенными страницами. Поэтому сначала
    # точный файл, потом .html, потом index.html в папке.
    #
    # no-cache здесь, а не по расширению: страницы открываются без
    # .html в адресе (/design), и правило «по .html» до них бы не дошло —
    # браузер кэшировал бы их наугад и после деплоя показывал старое.
    # no-cache не значит «не хранить»: браузер переспрашивает и получает
    # 304, если файл не менялся.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Редирект, который раньше делал next.config.ts. При статическом
    # экспорте Next их не поддерживает.
    location ~ ^/prices/?$ {
        return 301 /design/prices;
    }

    # Скрипты и стили Next: в имени хэш содержимого, поэтому их можно
    # кэшировать навсегда — новая версия придёт под новым именем.
    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Нарезанные картинки. Хэша в имени нет: если заменить исходник под
    # тем же именем, адрес не изменится. Неделя — компромисс между
    # скоростью и тем, как быстро разойдётся замена.
    location /_img/ {
        try_files $uri =404;
        expires 7d;
    }

    # 180 кадров поворота фигуры: без этого каждый переспрашивался бы
    # у сервера при каждом заходе
    location /hero/ {
        try_files $uri =404;
        expires 7d;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
